version: 2

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - name: sub1
    binaries:
      - sub1
    homepage: "https://github.com/iwamot/sub1"
    description: "Replace a literal text block in a file, exactly once."
    repository:
      owner: iwamot
      name: homebrew-tap
    skip_upload: "true"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sub1"]
          end

checksum:
  name_template: 'checksums.txt'

release:
  draft: true
  use_existing_draft: true

changelog:
  use: github-native
